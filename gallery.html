<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | No. Nine Café</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ---------- GLOBAL ---------- */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  font-family:'Inter',sans-serif;
  background:#f6f3ef;
  color:#1e1e1e;
}

/* ---------- NAVBAR (EXACT MATCH) ---------- */
.navbar{
  position:absolute;
  top:0;
  width:100%;
  padding:30px 80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
}

.brand{
  font-family:'Playfair Display',serif;
  font-size:30px;
  color:white;
}

.nav-links{
  display:flex;
  gap:36px;
}

.nav-links a{
  font-size:16px;
  font-weight:600;
  color:white;
  text-decoration:none;
  padding:10px 14px;
  position:relative;
}

.nav-links a::after{
  content:'';
  position:absolute;
  left:50%;
  bottom:4px;
  width:0;
  height:1.5px;
  background:#c8a97e;
  transform:translateX(-50%);
  transition:.35s;
}

.nav-links a:hover::after{width:70%;}

/* ---------- HERO VIDEO ---------- */
.hero-video{
  position:relative;
  height:100vh;
  overflow:hidden;
}

.hero-video video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-video::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
}

.hero-text{
  position:absolute;
  bottom:110px;
  left:80px;
  z-index:2;
  color:white;
  max-width:620px;
}

.hero-text h1{
  font-family:'Playfair Display',serif;
  font-size:4.5rem;
  line-height:1.1;
}

.hero-text p{
  margin-top:18px;
  opacity:.85;
}

/* ---------- STORY PANEL (CREATIVE SECTION) ---------- */
.story-panel{
  padding:180px 80px;
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:120px;
  align-items:center;
}

.story-text h2{
  font-family:'Playfair Display',serif;
  font-size:3.2rem;
  line-height:1.15;
}

.story-text p{
  margin-top:22px;
  max-width:420px;
  opacity:.75;
  font-size:1.05rem;
}

.story-visual{
  position:relative;
}

.story-visual .main-img{
  width:100%;
  height:520px;
  object-fit:cover;
  border-radius:28px;
}

.story-visual .float-img{
  position:absolute;
  bottom:-90px;
  left:-90px;
  width:320px;
  height:420px;
  object-fit:cover;
  border-radius:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}

/* ---------- SECOND VIDEO ---------- */
.mid-video{
  margin:0 80px 180px;
  height:70vh;
  border-radius:30px;
  overflow:hidden;
}

.mid-video video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ---------- IMAGE GRID ---------- */
.gallery-grid{
  padding:0 80px 200px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:34px;
}

.gallery-grid img{
  width:100%;
  height:360px;
  object-fit:cover;
  border-radius:24px;
}
/* ---------- GLOW HOVER FOR LAST 6 IMAGES ---------- */
.gallery-grid img{
  transition:
    transform .4s ease,
    box-shadow .4s ease,
    filter .4s ease;
}

.gallery-grid img:hover{
  transform:translateY(-6px);
  box-shadow:0 25px 60px rgba(200,169,126,.35);
  filter:brightness(1.02);
}


/* ---------- FOOTER ---------- */
/* ---------- NEW FOOTER ---------- */
.footer-new{
  position:relative;
  background:#111;
  color:#f6f3ef;
  padding:160px 80px 120px;
  overflow:hidden;
}

/* subtle brand watermark */
.footer-new::before{
  content:'NO. NINE';
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-family:'Playfair Display',serif;
  font-size:14rem;
  color:rgba(255,255,255,0.04);
  white-space:nowrap;
  pointer-events:none;
}

.footer-inner{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:36px;
  text-align:center;
}

.footer-brand h2{
  font-family:'Playfair Display',serif;
  font-size:3.2rem;
}

.footer-brand p{
  margin-top:10px;
  opacity:.8;
}

/* nav-style links */
.footer-links{
  display:flex;
  gap:36px;
  margin-top:10px;
}

.footer-links a{
  color:#f6f3ef;
  text-decoration:none;
  font-weight:500;
  position:relative;
}

.footer-links a::after{
  content:'';
  position:absolute;
  left:50%;
  bottom:-6px;
  width:0;
  height:1.5px;
  background:#c8a97e;
  transform:translateX(-50%);
  transition:.3s;
}

.footer-links a:hover::after{
  width:70%;
}


/* ---------- FOOTER SOCIAL SVG ICONS ---------- */
.footer-social{
  display:flex;
  gap:42px;
  margin-top:10px;
}

.social-icon{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.social-icon svg{
  width:100%;
  height:100%;
  fill:#f6f3ef;
  opacity:.85;
  transition:opacity .3s ease, transform .3s ease;
}

.social-icon:hover svg{
  opacity:1;
  transform:translateY(-2px);
}


.footer-social a{
  font-family:'Inter',sans-serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#f6f3ef;
  text-decoration:none;
  position:relative;
  opacity:.85;
}

.footer-social a::after{
  content:'';
  position:absolute;
  left:50%;
  bottom:-6px;
  width:0;
  height:1.5px;
  background:#c8a97e;
  transform:translateX(-50%);
  transition:.3s;
}

.footer-social a:hover{
  opacity:1;
}

.footer-social a:hover::after{
  width:70%;
}

/* closing line */
.footer-note{
  margin-top:40px;
  padding-top:40px;
  border-top:1px solid rgba(255,255,255,.15);
  width:100%;
  max-width:520px;
  text-align:center;
  font-size:.95rem;
  opacity:.75;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:600px){
  .footer-new{
    padding:120px 28px 100px;
  }

  .footer-links{
    flex-direction:column;
    gap:18px;
  }

  .footer-new::before{
    font-size:9rem;
  }
}


/* ---------- RESPONSIVE ---------- */
@media(max-width:900px){
  .navbar{padding:22px 28px}

  .hero-text{
    left:28px;
    right:28px;
    bottom:90px;
  }

  .hero-text h1{font-size:3.2rem}

  .story-panel{
    grid-template-columns:1fr;
    padding:140px 28px;
    gap:60px;
  }

  .story-visual .main-img{height:380px}

  .story-visual .float-img{
    position:relative;
    left:0;
    bottom:0;
    margin-top:24px;
    width:100%;
    height:320px;
  }

  .mid-video{
    margin:0 28px 120px;
    height:50vh;
  }

  .gallery-grid{
    grid-template-columns:1fr;
    padding:0 28px 160px;
  }

  footer{padding:120px 28px}
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="brand">No. Nine</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="gallery.html">Gallery</a>
    <a href="#">Visit</a>
  </div>
</nav>

<!-- HERO VIDEO -->
<section class="hero-video">
  <video src="7vdo.mp4" autoplay muted loop playsinline></video>
  <div class="hero-text">
    <h1>A Place for<br>Thoughtful Coffee</h1>
    <p>Moments of light, pause, and warmth.</p>
  </div>
</section>

<!-- CREATIVE STORY SECTION -->
<section class="story-panel">
  <div class="story-text">
    <h2>Where Time Slows</h2>
    <p>
      Coffee tastes better when nothing is rushed.
      Every detail here is designed to invite calm.
    </p>
  </div>

  <div class="story-visual">
    <img src="1.jpg" class="main-img" alt="">
    <img src="2.jpg" class="float-img" alt="">
  </div>
</section>

<!-- SECOND VIDEO -->
<section class="mid-video">
  <video src="5vdo.mp4" autoplay muted loop playsinline></video>
</section>

<!-- IMAGE GALLERY -->
<section class="gallery-grid">
  <img src="3.jpg">
  <img src="4.jpg">
  <img src="6.png">
  <img src="8.jpg">
  <img src="WhatsApp Image 2026-01-14 at 12.49.53 AM.jpeg">
  <img src="WhatsApp Image 2026-01-14 at 12.30.45 AM.jpeg">
</section>

<footer class="footer-new">
  <div class="footer-inner">
    <div class="footer-brand">
      <h2>No. Nine Café</h2>
      <p>A quiet place for thoughtful coffee.</p>
    </div>

   <div class="footer-social">
  <a href="#" aria-label="Instagram" class="social-icon">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 1.7a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM17.5 6a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z"/>
    </svg>
  </a>

  <a href="#" aria-label="Twitter" class="social-icon">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M22 5.9c-.8.4-1.6.6-2.5.8a4.1 4.1 0 0 0 1.8-2.3 8.3 8.3 0 0 1-2.6 1A4.1 4.1 0 0 0 11 8.2a11.7 11.7 0 0 1-8.5-4.3 4.1 4.1 0 0 0 1.3 5.4 4 4 0 0 1-1.9-.5v.1a4.1 4.1 0 0 0 3.3 4 4.2 4.2 0 0 1-1.8.1 4.1 4.1 0 0 0 3.8 2.8A8.3 8.3 0 0 1 2 17.6a11.7 11.7 0 0 0 6.3 1.9c7.5 0 11.6-6.2 11.6-11.6v-.5A8.1 8.1 0 0 0 22 5.9z"/>

</div>



    <div class="footer-note">
      <span>Calm by Day · Warm by Night</span>
    </div>
  </div>
</footer>


</body>
</html>
